name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "test/**", "docs/**", "chore/**", "refactor/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # windows-app attaches the package to releases on v* tags

jobs:
  java:
    name: Java tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure git identity for worktree tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Test
        run: ./gradlew test -PskipWeb --console=plain --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  windows-app:
    name: Windows app (jpackage)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Package app image (no installer toolchain needed)
        run: ./gradlew :server:jpackage -PskipWeb --console=plain --no-daemon
      - name: Zip app image
        shell: pwsh
        run: |
          $dir = Get-ChildItem server/build/jpackage -Directory | Select-Object -First 1
          Compress-Archive -Path $dir.FullName -DestinationPath "AI-CLI-Orchestrator-windows-x64.zip"
          Get-Item AI-CLI-Orchestrator-windows-x64.zip | Format-List Name, Length
      - name: Package MSI installer (WiX on the runner)
        id: msi
        continue-on-error: true
        run: ./gradlew :server:jpackage -PskipWeb -PjpackageType=msi --console=plain --no-daemon
      - name: Collect MSI
        if: steps.msi.outcome == 'success'
        shell: pwsh
        run: Get-ChildItem server/build/jpackage -Filter *.msi | Copy-Item -Destination . ; Get-ChildItem *.msi | Format-List Name, Length
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AI-CLI-Orchestrator-windows
          path: |
            AI-CLI-Orchestrator-windows-x64.zip
            *.msi
          if-no-files-found: error
      - name: Release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AI-CLI-Orchestrator-windows-x64.zip
            *.msi
          generate_release_notes: true
